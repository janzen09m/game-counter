```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punkte Counter</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            color: #f1c40f;
            font-size: 40px;
            margin-bottom: 40px;
        }

        .teams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .team {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
        }

        .team1 {
            border: 3px solid #2ed573;
        }

        .team2 {
            border: 3px solid #1e90ff;
        }

        .team h2 {
            margin-top: 0;
            font-size: 26px;
        }

        .score {
            font-size: 70px;
            font-weight: bold;
            color: #f1c40f;
            margin: 20px 0;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .plus {
            background: #2ed573;
            color: white;
        }

        .minus {
            background: #ff4757;
            color: white;
        }

        .reset {
            margin-top: 30px;
            background: #747d8c;
            color: white;
            width: 250px;
        }

        button:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        @media (max-width: 600px) {
            .teams {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏆 Punkte</h1>

    <div class="teams">

        <!-- TEAM 1 -->
        <div class="team team1">
            <h2>🟢 Team 1</h2>

            <div class="score" id="score1">0</div>

            <div class="buttons">
                <button class="plus" onclick="changeScore(1, 100)">+100</button>
                <button class="minus" onclick="changeScore(1, -100)">−100</button>

                <button class="plus" onclick="changeScore(1, 200)">+200</button>
                <button class="minus" onclick="changeScore(1, -200)">−200</button>

                <button class="plus" onclick="changeScore(1, 300)">+300</button>
                <button class="minus" onclick="changeScore(1, -300)">−300</button>

                <button class="plus" onclick="changeScore(1, 400)">+400</button>
                <button class="minus" onclick="changeScore(1, -400)">−400</button>

                <button class="plus" onclick="changeScore(1, 500)">+500</button>
                <button class="minus" onclick="changeScore(1, -500)">−500</button>
            </div>
        </div>


        <!-- TEAM 2 -->
        <div class="team team2">
            <h2>🔵 Team 2</h2>

            <div class="score" id="score2">0</div>

            <div class="buttons">
                <button class="plus" onclick="changeScore(2, 100)">+100</button>
                <button class="minus" onclick="changeScore(2, -100)">−100</button>

                <button class="plus" onclick="changeScore(2, 200)">+200</button>
                <button class="minus" onclick="changeScore(2, -200)">−200</button>

                <button class="plus" onclick="changeScore(2, 300)">+300</button>
                <button class="minus" onclick="changeScore(2, -300)">−300</button>

                <button class="plus" onclick="changeScore(2, 400)">+400</button>
                <button class="minus" onclick="changeScore(2, -400)">−400</button>

                <button class="plus" onclick="changeScore(2, 500)">+500</button>
                <button class="minus" onclick="changeScore(2, -500)">−500</button>
            </div>
        </div>

    </div>

    <button class="reset" onclick="resetScores()">
        🔄 Alles zurücksetzen
    </button>

</div>


<script>

    let score1 = 0;
    let score2 = 0;

    function changeScore(team, points) {

        if (team === 1) {
            score1 += points;
            document.getElementById("score1").innerText = score1;
        }

        if (team === 2) {
            score2 += points;
            document.getElementById("score2").innerText = score2;
        }
    }

    function resetScores() {

        score1 = 0;
        score2 = 0;

        document.getElementById("score1").innerText = 0;
        document.getElementById("score2").innerText = 0;
    }

</script>

</body>
</html>
```
